<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Primary Emerald Gradient -->
    <linearGradient id="ss-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>

    <!-- Deep Cooperative Teal Gradient -->
    <linearGradient id="ss-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22577A"/>
      <stop offset="60%" stop-color="#1B4965"/>
      <stop offset="100%" stop-color="#0F2837"/>
    </linearGradient>

    <!-- Mint Hand Gradient -->
    <linearGradient id="ss-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>

    <!-- Gold Sprout / Star Gradient -->
    <linearGradient id="ss-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B4332" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Cooperative Unity Ring (Two Embracing Arcs) -->
  <!-- Left Green Arc -->
  <path d="M19 47 C 9 39 9 24 19 16 C 23 13 27.5 11.5 32 12" stroke="url(#ss-emerald)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right Teal Arc -->
  <path d="M45 17 C 55 25 55 40 45 48 C 41 51 36.5 52.5 32 52" stroke="url(#ss-teal)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Protective Center Shield -->
  <path d="M32 16 L44 21 C44 32.5 39 41.5 32 45.5 C25 41.5 20 32.5 20 21 Z" fill="#FFFFFF" stroke="url(#ss-emerald)" stroke-width="1.8" filter="url(#ss-glow)"/>

  <!-- Cooperative Handshake Motif inside Shield -->
  <!-- Mint Hand from Left -->
  <path d="M22 28.5 C22 28.5 25 25.5 29 25.5 C31 25.5 33 27.5 35 28.5 L38 30.5 C37 32 35 33.5 33 33.5 L29 33.5 C26 33.5 23 31.5 22 28.5 Z" fill="url(#ss-mint)"/>
  <rect x="29" y="31.5" width="2.2" height="3" rx="0.8" fill="#1B4965"/>
  <rect x="31.8" y="30.5" width="2.2" height="3.5" rx="0.8" fill="#1B4965"/>
  <rect x="34.6" y="29.5" width="2.2" height="3.5" rx="0.8" fill="#1B4965"/>

  <!-- Deep Teal Hand from Right -->
  <path d="M42 28.5 C42 28.5 39 25.5 35 25.5 C33 25.5 31 27.5 29 28.5 L26 30.5 C27 32 29 33.5 31 33.5 L35 33.5 C38 33.5 41 31.5 42 28.5 Z" fill="url(#ss-teal)"/>

  <!-- Wrist Cuffs -->
  <path d="M20.5 26.5 L22.5 30.5" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round"/>
  <path d="M43.5 26.5 L41.5 30.5" stroke="#1B4965" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden 3-Leaf Sprout of Prosperity at Crest -->
  <path d="M32 15 L32 7" stroke="url(#ss-gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Sprout Leaf -->
  <path d="M32 5 C33.5 7.5 33.5 10 32 12 C30.5 10 30.5 7.5 32 5 Z" fill="url(#ss-gold)"/>
  <!-- Left Sprout Leaf -->
  <path d="M32 9 C29.5 8 27.5 5.5 27.5 5.5 C28.5 8 30.5 10 32 11 Z" fill="url(#ss-gold)"/>
  <!-- Right Sprout Leaf -->
  <path d="M32 9 C34.5 8 36.5 5.5 36.5 5.5 C35.5 8 33.5 10 32 11 Z" fill="url(#ss-gold)"/>

  <!-- Radiant Spark at Top -->
  <circle cx="32" cy="3.5" r="1.2" fill="#FDE68A"/>
</svg>
